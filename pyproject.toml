[project]
name = "ssv_reutlingen"
authors = [
    { name = "phamos.eu", email = "support@phamos.eu" },
]
description = "ERP system for SSV Reutlingen football club"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "ssv_reutlingen"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"
